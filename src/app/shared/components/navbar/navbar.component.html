<div class="d-flex flex-column h-100 p-3 text-white">
  <!-- Profile info -->
  <div class="profile text-center my-4">
    <!-- Poza reală de profil -->
    <img src="/profile.JPG" alt="Eduard Banciu" class="img-fluid rounded-circle profile-img mb-3">
    
    <h1 class="text-light fs-4 fw-bold mb-2">Eduard Banciu</h1>
    <!--<span class="badge bg-primary px-3 py-2">IT PFA</span>-->
    
    <div class="social-links mt-3 d-flex justify-content-center gap-2">
      <!-- Github și LinkedIn ascunse temporar
      <a href="https://github.com" target="_blank" class="social-btn"><i class="bi bi-github"></i></a>
      <a href="https://linkedin.com" target="_blank" class="social-btn"><i class="bi bi-linkedin"></i></a>
      -->

      <!-- Buton Telefon (Deschide dialer-ul pe mobil) -->
      <a href="tel:+40745013838" class="social-btn" title="Sună acum">
        <i class="bi bi-telephone"></i>
      </a>
      
      <!-- Buton Email -->
      <a href="mailto:banciu.edy@gmail.com" class="social-btn" title="Trimite un email">
        <i class="bi bi-envelope"></i>
      </a>
    </div>
  </div>
  
  <!-- Navigation menu -->
  <nav id="nav-menu" class="nav-menu mt-4 flex-grow-1">
    <ul class="list-unstyled">
      <li>
        <a (click)="scrollTo('acasa')" [class.active]="currentSection === 'acasa'" class="nav-link active" role="button">
          <i class="bi bi-house-door me-2"></i> <span>Acasă</span>
        </a>
      </li>
      <li>
        <a (click)="scrollTo('despre')" [class.active]="currentSection === 'despre'" class="nav-link" role="button">
          <i class="bi bi-person me-2"></i> <span>Despre Mine</span>
        </a>
      </li>
      <li class="nav-item">
        <a (click)="toggleServicesMenu()" [class.collapsed]="!isServicesMenuOpen" [class.active]="serviceSections.includes(currentSection)" class="nav-link" role="button">
          <i class="bi bi-hdd-network me-2"></i> <span>Servicii IT</span> 
          <i class="bi bi-chevron-down ms-auto" [style.transform]="isServicesMenuOpen ? 'rotate(180deg)' : 'none'" style="transition: transform 0.3s ease;"></i>
        </a>
        <div class="collapse" [class.show]="isServicesMenuOpen" [style.display]="isServicesMenuOpen ? 'block' : 'none'">
          <ul class="nav flex-column submenu-list">
            <li class="nav-item">
              <a (click)="scrollTo('suport-software')" [class.active]="currentSection === 'suport-software'" class="nav-link" role="button">
                <i class="bi bi-dash"></i> <span> Suport Software</span>
              </a>
            </li>
            <li class="nav-item">
              <a (click)="scrollTo('reparatii-hardware')" [class.active]="currentSection === 'reparatii-hardware'" class="nav-link" role="button">
                <i class="bi bi-dash"></i> <span> Reparații Hardware</span>
              </a>
            </li>
            <li class="nav-item">
              <a (click)="scrollTo('asamblare-pc')" [class.active]="currentSection === 'asamblare-pc'" class="nav-link" role="button">
                <i class="bi bi-dash"></i> <span> Asamblare PC</span>
              </a>
            </li>
            <li class="nav-item">
              <a (click)="scrollTo('retelistica')" [class.active]="currentSection === 'retelistica'" class="nav-link" role="button">
                <i class="bi bi-dash"></i> <span> Rețelistică</span>
              </a>
            </li>
            <li class="nav-item">
              <a (click)="scrollTo('administrare-servere')" [class.active]="currentSection === 'administrare-servere'" class="nav-link" role="button">
                <i class="bi bi-dash"></i> <span> Administrare Servere</span>
              </a>
            </li>
            <li class="nav-item">
              <a (click)="scrollTo('dezvoltare-software')" [class.active]="currentSection === 'dezvoltare-software'" class="nav-link" role="button">
                <i class="bi bi-dash"></i> <span> Dezvoltare Software</span>
              </a>
            </li>
            <li class="nav-item">
              <a (click)="scrollTo('consultanta-it')" [class.active]="currentSection === 'consultanta-it'" class="nav-link" role="button">
                <i class="bi bi-dash"></i> <span> Consultanță IT</span>
              </a>
            </li>
          </ul>
        </div>
      </li>
      <!-- TEMPORAR ASCUNS
      <li>
        <a (click)="scrollTo('portfoliu')" [class.active]="currentSection === 'portfoliu'" class="nav-link" role="button">
          <i class="bi bi-code-slash me-2"></i> <span>Portofoliu</span>
        </a>
      </li>
      -->
      <li>
        <a (click)="scrollTo('contact')" [class.active]="currentSection === 'contact'" class="nav-link" role="button">
          <i class="bi bi-envelope-at me-2"></i> <span>Contact</span>
        </a>
      </li>
    </ul>
  </nav>
  
  <!-- Footer sidebar -->
  <div class="sidebar-footer text-center text-muted small py-3 border-top border-secondary">
    &copy; {{ currentYear }} Eduard Banciu PFA
  </div>
</div>
